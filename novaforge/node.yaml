# NovaForge capability profile additions (T-232) — merge into the node's
# profiles.d/default.yaml (the doc.process block below) and publish:
#   node-cli capabilities validate default
#   node-cli capabilities publish default
#
# The handler POSTs to the local Hermes API Server (the agent.ai pattern:
# http://127.0.0.1:8642/v1/chat/completions with Bearer API_SERVER_KEY,
# started via hermes gateway). The verdict works from the OCR text; the
# optional pdf artifact ref is accepted for the V2 VLM-OCR route.
node_name: novaforge

capabilities:
  - name: doc.process
    version: "1.0.0"
    type: ai
    description: "Filing verdict for a document: returns {title, tags[], correspondent?, summary, confidence} from the OCR text."
    auto_publish: true
    claimable: true
    handler: ~/iowap-paperless/novaforge/doc_process.py
    max_parallel: 1
    timeout: 300
    upload_modes: [artifact, inline]
    input_schema:
      fields:
        document_text:
          name: document_text
          type: string
          required: true
          description: "Paperless' OCR content field for the document."
        filename:
          name: filename
          type: string
          required: false
          description: "Original filename (for the verdict context)."
        pdf:
          name: pdf
          type: object
          required: false
          description: "Optional transfer envelope (__iowap_ref__, artifact/inline) with the document PDF — informational in V1."